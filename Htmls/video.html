<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YusufTube</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- External CSS -->
<link rel="stylesheet" href="../Css/VideoStyle.css">

<!-- Favicon -->
<link rel="icon" type="image/png" href="./Images/YusufTube-Logo.png?v=3">
<link rel="apple-touch-icon" href="./Images/YusufTube-Logo.png?v=3">
<link rel="icon" type="image/png" href="../Images/YusufTube-Logo.png?v=3">
<link rel="apple-touch-icon" href="../Images/YusufTube-Logo.png?v=3">
</head>

<body>

<header>
<div class="logo" onclick="window.location.href='../index.html'">
<i class="fa-solid fa-fire"></i> YusufTube
</div>

<div class="search-bar">
<input type="text" id="searchInput" placeholder="Search videos...">
<button><i class="fa-solid fa-magnifying-glass"></i></button>
<button id="voiceBtn"><i class="fa-solid fa-microphone"></i></button>
</div>

<div class="user-actions">
<i class="fa-regular fa-bell"></i>
<div class="user-icon" onclick="window.location.href='Register.html'">?</div>
</div>
</header>

<div class="container">
<div class="main-content">
<div class="video-container-relative">
<video id="glowPlayer" muted></video>
<div class="video-wrapper">
<video id="videoPlayer" controls autoplay></video>
</div>
</div>

<canvas id="colorSampler" style="display:none;"></canvas>
<div class="video-title" id="mainTitle">Select a video</div>

<div class="video-meta-row">
<button class="pill-btn" id="likeBtn"><i class="fa-regular fa-thumbs-up"></i> <span id="likeCount">0</span></button>
<button class="pill-btn" id="dislikeBtn"><i class="fa-regular fa-thumbs-down"></i> <span id="dislikeCount">0</span></button>
<button class="pill-btn" id="saveBtn"><i class="fa-solid fa-download"></i> Save</button>
</div>

<div class="description-box">
<span id="viewCountDisplay">0 views</span>
<p>Enjoy the best meme compilations and orange glow content.</p>
</div>
</div>

<div class="sidebar">
<div id="videoList"></div>
</div>
</div>

<script type="module" src="../JavaScript/FireBase.js"></script>
<script type="module" src="../JavaScript/videoScript.js"></script>
</body>
</html>
